[workspace]
resolver = "3"
members = [
  "app",
  "crates/oneline-core",
  "crates/oneline-simd",
  "crates/oneline-gpu",
  "crates/oneline-tomet",
  "benches",
]

default-members = ["app"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"

[workspace.dependencies]
oneline-cli   = { path = "app" }
oneline-core  = { path = "crates/oneline-core" }
oneline-gpu   = { path = "crates/oneline-gpu" }
oneline-simd  = { path = "crates/oneline-simd" }
oneline-tomet = { path = "crates/oneline-tomet" }

#= Tomet
tomet-ast        = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-ast-parser = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-span       = { git = "https://github.com/tomet-lang/tomet.git" }

#= GPU & Parallelism
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rayon    = "1.10"
wgpu     = "24"

#= Crates.io
aho-corasick = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", default-features = false, features = [
  "cargo_bench_support",
] }
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
simd-json = "0.18"
simdjson-sys = "=0.4.0-alpha.2"
simdutf8 = "0.1"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev.package."*"]
opt-level = 3
